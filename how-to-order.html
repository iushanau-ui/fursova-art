<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to order — Elizaveta Fursova</title>
  <meta name="description" content="How to order an original painting by Elizaveta Fursova. Worldwide shipping.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼</text></svg>">
</head>
<body data-title-key="nav.how">

  <canvas id="bgShader" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div class="utilities">
    <div class="switchers"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="cartBtn" aria-label="Cart">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </button>
  </div>

  <header class="site-head" id="top">
    <a class="site-name" href="index.html" data-artist-name>Elizaveta Fursova</a>
    <nav class="site-nav">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="buy-art.html" data-i18n="nav.buy">Buy art</a>
      <a href="prints.html" data-i18n="nav.prints">Prints</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="how-to-order.html" class="active" data-i18n="nav.how">How to order</a>
      <a href="contacts.html" data-i18n="nav.contacts">Contacts</a>
    </nav>
  </header>

  <main>
    <section class="section" id="how">
      <h2 class="giant reveal" data-i18n="how.title">How to order</h2>
      <ol class="steps" id="stepsList"></ol>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-artist-name>Elizaveta Fursova</span>. <span data-i18n="footer">All images are protected by copyright.</span></p>
  </footer>

  <!-- КОРЗИНА -->
  <div class="drawer-overlay" id="cartDrawer" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Cart">
      <div class="drawer-head">
        <h3 data-i18n="cart.title">Cart</h3>
        <button class="modal-close" data-close-cart aria-label="Close">×</button>
      </div>
      <div class="drawer-items" id="cartItems"></div>
      <div class="drawer-empty" id="cartEmpty" data-i18n="cart.empty">Your cart is empty</div>

      <form class="drawer-form" id="orderForm" hidden>
        <div class="drawer-total"><span data-i18n="cart.total">Total:</span> <strong id="cartTotal"></strong></div>
        <input type="text" id="fName" data-i18n-ph="cart.name" placeholder="Your name" required>
        <input type="text" id="fContact" data-i18n-ph="cart.contact" placeholder="Telegram, phone or e-mail" required>
        <textarea id="fComment" data-i18n-ph="cart.comment" placeholder="Order notes (optional)" rows="2"></textarea>
        <button type="submit" class="btn btn-primary btn-wide" data-i18n="cart.sendTg">Send order via Telegram</button>
        <button type="button" class="btn btn-ghost btn-wide" id="sendMail" data-i18n="cart.sendMail">Send by e-mail</button>
        <p class="drawer-hint" data-i18n="cart.hint">The button copies your order text and opens the chat.</p>
      </form>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shader.js"></script>
</body>
</html>
